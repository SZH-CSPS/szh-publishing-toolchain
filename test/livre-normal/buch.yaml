#     qui regroupe deux chapitres ; les auteur·e·s de chapitre au-dessus du titre ;
#   * l'impressum complet (textes factices) et une pièce de fin de notices d'auteur·e·s ;
#   * le dos calculé, et la couverture à plat qui en découle.
