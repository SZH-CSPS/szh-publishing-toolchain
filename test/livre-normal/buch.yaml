#   * l'ouverture de chapitre sur belle page ;
#   * une figure dont la légende ne doit pas se détacher de son image ;
#   * la numérotation des figures qui court d'un chapitre à l'autre ;
#   * les liminaires (demi-titre, impressum, page de titre, dédicace, sommaire en double
#     page, avant-propos) dans l'ordre ;
