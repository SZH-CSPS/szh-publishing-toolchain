# Banc d'essai du moteur livre, maquette « normal » — un OUVRAGE COLLECTIF.
# Il pose le second jeu de valeurs du bloc mise-en-page (titre de chapitre au corps du
# texte, auteur·e·s dessous, intertitres demi-gras, figures à filets, tableaux zébrés,
# sommaire hiérarchique…). Texte factice : aucun livre réel, aucun nom réel.
#
# Ce qu'il éprouve :
#   * chaque clé du bloc mise-en-page ailleurs qu'à sa valeur par défaut ;
#   * les auteur·e·s de chapitre, lus dans chaque fiche, sous le titre et au sommaire ;
#   * la numérotation des figures et des tableaux qui repart à chaque chapitre ;
#   * un tableau nu de l'éditeur, un tableau markdown, un tableau zébré par l'éditeur ;
#   * la structure : parties romaines sans page à elles (I, II, puis III avec une
#     introduction et deux chapitres non numérotés), deux parties arabes sur page seule
#     dont les chapitres sont numérotés 1.1, 1.2, 2.1, une partie V de notices en grille de
#     portraits (images grises factices) ; des chapitres sans titre ; les éditeurs
#     « (Hrsg.) » sur le demi-titre et la page de titre ; l'impressum complet.
