title:
  de: "Herausforderungen im Unterricht begegnen"
subtitle:
  de: "Kreislauf zur Bearbeitung von herausfordernden Unterrichtssituationen"
resume:
  fr: "L'article présente un cycle d’analyse des situations d'enseignement complexes, en s'appuyant sur la « Syndromanalyse » (qu’on peut traduire par « analyse syndromique ») selon Zimpel. Il met l’accent sur l'approche compréhensive, qui favorise l’adoption de différentes perspectives afin d’interpréter les comportements dans leur contexte social. En tant qu’outil systématique, ce cycle d’analyse offre une méthode applicable à différentes situations, tout en tenant compte de leurs spécificités. Structuré en cinq étapes méthodologiques, il permet un processus d’analyse et de réflexion fondé sur des bases théoriques, offrant ainsi aux enseignantes et aux enseignants des clés pour mieux comprendre les situations complexes et élaborer des pistes d’intervention."
  de: "Der Artikel stellt den Kreislauf zur Bearbeitung herausfordernder Unterrichtssituationen vor, angelehnt an die Syndromanalyse nach Zimpel. Zentral ist der verstehende Zugang, der durch eine Perspektivenübernahme ermöglicht, Verhaltensweisen im sozialen Kontext zu deuten. Der Kreislauf bietet als systematisches Instrument eine Methode, die auf unterschiedliche Situationen anwendbar ist und deren Besonderheiten einbezieht. In fünf methodischen Schritten wird ein theoriegeleiteter Analyse- und Reflexionsprozess ermöglicht, der Lehrpersonen dabei unterstützt, herausfordernde Situationen besser zu verstehen und Handlungsmöglichkeiten zu entwickeln."
