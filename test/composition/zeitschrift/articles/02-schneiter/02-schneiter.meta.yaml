title:
  de: "You «C» Cards"
subtitle:
  de: "visuelle Struktur und Partizipation für mehr Inklusion im Musikunterricht"
resume:
  fr: "Les cartes « You ‹C› Cards » sont un jeu de cartes pictographique innovant destiné à l’enseignement individuel des instruments et du chant. L’objectif est de rendre le contenu et les stratégies d’enseignement plus claires, d’offrir des repères aux élèves et de leur permettre de participer activement. Ainsi, l’autodétermination et la motivation sont durablement renforcés. Ces cartes sont particulièrement pertinentes pour l'éducation musicale inclusive, car elles constituent un système de soutien visuel qui prévient la surcharge cognitive et renforce les parcours d'apprentissage individuels. Il s'agit là d'un avantage essentiel pour les personnes neurodivergentes et les personnes en situation de handicap. Les cartes mettent en lumière les ressources et les forces des apprenantes et apprenants."
  de: "Die You «C» Cards sind ein innovatives Piktogramm-Kartenset für den individuellen Instrumental- und Vokalunterricht. Ziel ist es, Unterrichtsinhalte und Strategien klarer sichtbar zu machen, Orientierung zu schaffen und Schüler:innen aktive Mitgestaltung zu ermöglichen. Dadurch werden Selbstbestimmung und Motivation nachhaltig gefördert. Die Karten sind besonders relevant für die inklusive musikalische Bildung, da sie als visuell unterstützendes System Überforderung präventiv entgegenwirken und individuelle Lernwege stärken. Dies ist ein zentraler Vorteil für neurodivergente Menschen und Menschen mit Behinderungen. Die Karten lenken den Blick auf die Ressourcen und Stärken der Lernenden."
