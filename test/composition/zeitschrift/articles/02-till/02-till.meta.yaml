title:
  de: "Sprachunterstützende Massnahmen im Teamteaching"
subtitle:
  de: "Kooperative Praktiken von Regellehrpersonen, Schulischen Heilpädagog:innen und Logopäd:innen"
resume:
  fr: "Les élèves présentant des troubles du langage, de la parole et de la communication peuvent bénéficier de différentes mesures de soutien linguistique. Celles-ci peuvent être particulièrement efficaces lorsqu'elles sont intégrées à l’enseignement et mises en œuvre dans le cadre d’un co-enseignement (Teamteaching). Ces conditions reposent, entre autres, sur l’expertise combinée de professionnelles et professionnels de l’enseignement ordinaires, de la pédagogie spécialisée et de la logopédie. Par ailleurs, il est essentiel que la direction de l'école favorise la coopération entre ces différentes corps de métier. Cet article présente et discute les résultats de l'étude « SpriCH » qui a révélé que les professionnelles et professionnels des trois domaines recourent rarement au co-enseignement. Ces personnes ont également une perception plutôt négative de l'action de la direction de l'école. Néanmoins, les personnes interrogées ont jugé leur situation de travail satisfaisante."
  de: "Schüler:innen mit Sprach-, Sprech- und Kommunikationsauffälligkeiten können mit verschiedenen sprachunterstützenden Massnahmen gefördert werden. Besonders effektiv können diese sein, wenn sie unterrichtsintegriert und im Teamteaching durchgeführt werden. Voraussetzung hierfür ist die Expertise unter anderem von Regellehrpersonen, Schulischen Heilpädagog:innen und Logopäd:innen. Wichtig ist aber auch, dass die Schulleitung für kooperationsförderliche Bedingungen sorgt. Der Artikel präsentiert und diskutiert die Ergebnisse der Studie «SpriCH». In dieser Befragung zeigte sich, dass die drei Berufsgruppen nur selten Teamteaching umsetzen. Auch das Handeln der Schulleitung nehmen sie eher negativ wahr. Dennoch beurteilten die Befragten ihre Arbeitssituation als zufriedenstellend."
