title:
  fr: "Vers un enseignement supérieur inclusif"
subtitle:
  fr: "Explorer les perceptions, pratiques et besoins des enseignantes et enseignants en matière de pédagogie inclusive"
resume:
  fr: "L’article examine les pratiques pédagogiques dites inclusives dans un contexte d’enseignement supérieur du point de vue des enseignantes et enseignants. Fondé sur une enquête auprès du corps enseignant de la Haute école spécialisée de Suisse occidentale (HES-SO), il met en évidence l’importance accordée à ces pratiques de même que leur fréquence de mise en œuvre lors de la planification des enseignements, de l’animation des cours et de l’évaluation des apprentissages. Sont également exposés les principaux freins rencontrés et les besoins formulés afin de pouvoir les implémenter."
  de: "In diesem Artikel werden sogenannte inklusive Lehrmethoden in der Hochschulbildung aus der Sicht der Lehrkräfte untersucht. Auf der Grundlage einer Umfrage unter den Lehrkräften der Fachhochschule Westschweiz (HES-SO) wird aufgezeigt, welche Bedeutung diesen Lehrmethoden beigemessen wird und wie häufig sie bei der Planung des Unterrichts, der Durchführung von Kursen und der Bewertung der Lernenden angewendet werden. Darüber hinaus werden die wichtigsten Hindernisse sowie der Bedarf für die Umsetzung dieser Lehrmethoden dargelegt."
