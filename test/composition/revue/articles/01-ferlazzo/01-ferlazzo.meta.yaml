title:
  fr: "Soutien à l’emploi pour les personnes ayant un TSA"
subtitle:
  fr: "Défis, enjeux et bonnes pratiques"
resume:
  fr: "Cet article met en exergue l’importance de l’intégration professionnelle des personnes avec un trouble du spectre de l’autisme (TSA), en soulignant les obstacles rencontrés tels que les préjugés, les défis communicationnels et les sensibilités sensorielles. Les pratiques inclusives et l’accompagnement personnalisé sont mis en avant comme clés de réussite. En parallèle, l’association Actifs s’investit résolument dans l’intégration professionnelle des personnes en situation de handicap, en particulier celles ayant un TSA. Elle propose des solutions sur mesure, allant de la formation spécifique au coaching individuel, en passant par la création de partenariats stratégiques avec les secteurs locaux. L’exemple d’un bénéficiaire passionné par l’informatique, qui a surmonté les obstacles sociaux et professionnels pour réussir dans le monde du travail, incarne l’efficacité de cette approche."
  de: "Dieser Artikel betont die Bedeutung der beruflichen Integration von Menschen mit einer Autismus-Spektrum-Störung (ASS). Es werden Hindernisse wie Vorurteile, kommunikative Herausforderungen und sensorische Sensibilitäten thematisiert. Inklusive Praktiken und persönliche Betreuung werden als Schlüssel zum Erfolg hervorgehoben. Parallel dazu setzt sich die Vereinigung Actifs entschieden für die berufliche Eingliederung von Menschen mit Behinderungen ein, insbesondere von Menschen mit ASS. Sie bietet massgeschneiderte Lösungen an, die von spezifischen Schulungen über individuelles Coaching bis hin zum Aufbau strategischer Partnerschaften mit den lokalen Sektoren reichen. Die Wirksamkeit dieses Ansatzes wird veranschaulicht anhand eines Beispiels: Ein Mann mit einer Leidenschaft für Computer hat soziale und berufliche Hindernisse überwunden und ist in der Arbeitswelt erfolgreich."
