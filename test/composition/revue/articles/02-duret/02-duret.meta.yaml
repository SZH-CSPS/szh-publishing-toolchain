title:
  fr: "Les caractéristiques des enfants des classes régionales de la pédagogie spécialisée lors d’une activité collaborative"
resume:
  fr: "En Suisse, les classes régionales de pédagogie spécialisée (CRPS) visent une intégration des enfants en milieu ordinaire. Cette étude exploratoire comparative étudie les compétences en communication non verbale et en coopération motrice chez les enfants de CRPS par rapport aux enfants de classes ordinaires, lors d’un jeu de construction. Les résultats montrent que les enfants de CRPS auraient une communication non verbale plus désorganisée et une coopération motrice moins efficiente. Pour favoriser la future intégration sociale des enfants de CRPS, il serait intéressant de stimuler les compétences nécessaires lors de tâches collaboratives."
  de: "In der Schweiz zielen Sonderklassen in Regelschulen (les classes régionales de pédagogie spécialisée [CRPS]) darauf ab, Kinder in die Regelschule zu integrieren. Eine explorative Vergleichsstudie untersucht, inwiefern sich die nonverbalen Kommunikationsfähigkeiten und die motorische Kooperation während eines Konstruktionsspiels bei Kindern in Sonderklassen und Kindern in Regelklassen unterscheiden. Die Ergebnisse zeigen, dass bei Kindern aus Sonderklassen die nonverbale Kommunikation unorganisierter und die motorische Kooperation weniger effizient sind. Um Kinder aus Sonderklassen stärker sozial zu integrieren, wäre es wichtig, genau diese Fähigkeiten - Zusammenarbeit und nonverbale Kommunikation - gezielt zu fördern."
