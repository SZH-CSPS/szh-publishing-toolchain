# Invariants des cas du banc : un bloc [nom] par fichier nom.html de ce dossier.
# Mode d'emploi et exemple : test/weasyprint-banc/README.md.
#
# Vérifiés pour chaque cas, sans rien déclarer :
#   exception           le rendu ne lève pas d'exception ;
#   veraPDF             variante ua1 : aucune clause en échec hors de `vera_ua1` ;
#   extraction-*        chaque jeton Qnn du texte du HTML se lit une fois, et une seule, dans
#                       le texte extrait par pypdf et par pdfium (sauf `doublons_admis`) ;
#   pixels-variantes    ua1, tags, nu et a3u donnent les mêmes pixels ;
#   arbre-*             variantes balisées : MCID orphelin, fantôme ou cité deux fois,
#                       ParentTree incohérent, /P ou /Pg faux, /ID en double ou hors /IDTree,
#                       annotation sans OBJR, OBJR sans annotation, /LI à enfant autre que
#                       /Lbl et /LBody, élément vide, jeton présent deux fois dans l'arbre
#                       (sauf ce que liste `tolere`) ;
#   arbre-perte         chaque jeton du texte du HTML est dans l'arbre ;
#   colle-brut          dans le texte des contenus marqués lu à la suite, sans tenir compte
#                       de la position, aucun jeton n'est collé à un mot, d'un côté ou de
#                       l'autre, s'il ne l'est pas à la lecture par position ;
#   mots-brut           ce texte brut a les mêmes mots que le texte lu par position, sauf
#                       un mot coupé après un trait explicite et recollé (« bien-être ») ;
#                       ni l'un ni l'autre n'est jamais admis dans `connus` ;
#   lien-sans-contents  toute annotation /Link a un /Contents.
#
# Déclarés par cas :
#   titre           ce que le cas éprouve, en une phrase (obligatoire) ;
#   ordres          listes de jetons : l'ordre de lecture de l'arbre aplati, restreint à ces
#                   jetons, doit être exactement celui-là (ordre-1, ordre-2…) ;
#   langues         jeton = langue attendue (/Lang de l'élément ou de ses ancêtres, sinon
#                   celle du catalogue) ;
#   chemins         jeton = fin attendue du chemin de rôles (expression régulière) ;
#   liens           cible = /Contents attendu ;
#   meme_contenu    listes de jetons qui doivent se lire dans un même contenu marqué
#                   (même page, même MCID) : les lignes d'un même texte ;
#   contenus_distincts  listes de jetons qui doivent se lire chacun dans son propre
#                   contenu marqué : les frontières d'éléments en ligne ;
#   info_author     /Info /Author attendu ; dc_language : langues attendues du XMP ;
#   vera_ua1        clauses veraPDF admises en ua1 ;
#   vera_ua1_exige  clauses qui doivent échouer : un défaut signalé doit le rester ;
#   figures         alt = /Alt attendu d'une /Figure ; figures_sans_alt : nombre minimal
#                   de /Figure sans /Alt ;
#   doublons_admis  jetons qu'on peut lire deux fois (en-tête de tableau répété) ;
#   tolere          contrôles d'arbre ignorés pour ce cas (nom sans le préfixe arbre-) ;
#   dans_arbre      jetons attendus dans l'arbre, quand ce ne sont pas tous ceux du HTML ;
#   connus          { variante = [invariants] } : limites admises, listées à part, qui ne
#                   font pas échouer le banc.

