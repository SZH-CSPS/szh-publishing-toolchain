# Ancrage : condition nécessaire pour qu'une affaire soit retenue.
# Un terme est une chaîne ou { t, s, m, cs, ambigu }. Défauts pris dans le concept.
#   s      source : cdph:artN | termdat | lhand | lai | concordat | edudoc | corpus | manuel
#   m      mode : "debut" (début de mot, défaut : couvre flexions) | "mot" (mot entier) | "sous" (n'importe où,
#          utile pour les composés allemands)
#   cs     true : respecte la casse (sigles)
#   ambigu true : ne suffit pas seul pour retenir
#   contexte "ecole" : ne compte que si un terme de [contexte.ecole] figure aussi dans le même texte
# La comparaison se fait sans accents ni casse, apostrophes ramenées à l'espace. Qu'un terme "cdph:artN" figure bien
# dans cet article, dans sa langue, se contrôle par un outil d'étude hors de ce dépôt.

[contexte.ecole]
fr = ["école", "élève", "scolaire", "scolarité", "enseignement", "enseignant", "classe", "formation"]
de = ["Schule", "Schüler", "schulisch", "Unterricht", "Lehrperson", "Klasse", "Bildung", { t = "schul", m = "sous" }]
it = ["scuola", "allievo", "alunno", "scolastic", "insegnamento", "docente", "classe", "formazione"]

