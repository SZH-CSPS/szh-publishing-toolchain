# Thématiques de la Revue suisse de pédagogie spécialisée et de la Schweizerische Zeitschrift für Heilpädagogik.
# Périmètre élargi : un faux positif se refuse dans la vue Propositions, un faux négatif ne se voit pas. Une affaire
# qui touche une thématique sans ancrage handicap ni besoins particuliers devient « à relire » (pas « retenu »),
# d'après son titre seul.
#
# Sources de la liste (chaque thème dit lesquelles) :
#   csps.ch      arborescence « Thèmes » du site du CSPS (accueil et plan du site)
#   categories   catégories de la Documentation, en place et proposées (thème, degré, besoins)
#   contrat      pipeline/kirby/champs-documentation.json (types et rubriques de la Documentation)
#   fiches       titres des fiches de _NewsUndActu\Fiches (rundschau, revueblick, forschung, vorstoesse)
# Mêmes conventions de termes que ancrage.toml. Le thème « école ordinaire » (liste `ecole_generale` de
# ancrage.toml) reste à part : il a son interrupteur `[classement] ecole_generale`.

