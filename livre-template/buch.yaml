# Métadonnées d'un livre, lues à chaque compilation (l'équivalent d'ausgabe.yaml pour un
# numéro de revue). La plupart se modifient dans le formulaire du livre, dans le cockpit.
#
#   titre, sous-titre : tels qu'ils s'impriment sur la couverture et la page de titre.
#   ouvrage : « monographie » ou « collectif ».
#             Monographie : les auteurs sont listés ici, dans `auteurs:`.
#             Collectif : chaque chapitre a ses auteurs dans sa fiche (<slug>.meta.yaml, à
#             côté de son .md, même format qu'un article de revue), et `auteurs:` reste vide.
#   lang    : langue du texte du livre (fr, de ou it).
#   maquette: « normal » ou « falc » (facile à lire et à comprendre).
#   format  : « standard » (155 × 225 mm) ou « a4 » (210 × 297 mm, FALC seulement).
#   collection, tome : la collection et le numéro du volume, ou vides.
#   isbn-print, isbn-ebook, doi : à remplir quand ils sont attribués ; vides, ils restent
#             vides sur la page de colophon.
#   couleur : couleur d'accent (pastille de chapitre, onglet de tranche en FALC).
#   couverture.modele : « falc », « classique », « recherche » (Sonderpädagogische Forschung
#             in der Schweiz) ou « prospectrum » ; vide, la maquette décide (falc ou
#             classique). Un intertitre de 4e de couverture s'écrit « # Intertitre ».
#   auteurs : monographie seulement (voir `ouvrage`).
#   ordre-chapitres : vide = l'ordre des dossiers de chapitres/ (préfixes 01-, 02-…).
#   liminaires : les pièces liminaires, dans l'ordre d'impression. « demi-titre »,
#             « colophon », « page-titre » et « sommaire » sont composés automatiquement ; un
#             nom de fichier (« avant-propos.md ») désigne une pièce du dossier liminaires/.
#   impression : grammage et main du papier, pour calculer l'épaisseur du dos. Ce sont des
#             valeurs de départ : la main est donnée par l'imprimeur. `dos-mm` impose
#             l'épaisseur quand elle est connue.
#
# État du livre, comme pour un numéro :
#   locked   : livre gelé, en lecture seule jusqu'au déverrouillage.
#   archived : le dossier est dans les archives.
#   version-toolkit : version de Pronto qui a créé le livre (posée par new-livre.ps1).
titre: ""
sous-titre: ""
ouvrage: monographie
lang: fr
maquette: normal
format: standard
collection: ""
tome: ""
annee:
isbn-print: ""
isbn-ebook: ""
doi: ""
licence: cc-by-nc-nd-4.0
couleur: "#5F9FBC"
auteurs: []
ordre-chapitres: []
liminaires: [demi-titre, colophon, page-titre, sommaire, avant-propos.md]
impression:
  grammage: 90
  main: 1.22
  dos-mm:
  fond-perdu-mm: 3
  traits-de-coupe: true
  # Profil CMJN du PDF imprimeur, cherché dans /opt/icc/ de l'image : PSO Uncoated v3
  # (FOGRA52), papier non couché, ISO 12647-2:2013, encrage maximal 300 %.
  # Le profil est choisi par l'imprimerie : s'il en demande un autre, changer ce nom de
  # fichier. Vide, le PDF imprimeur sort en RVB, avec fond perdu et traits de coupe.
  # Si le profil manque dans l'image, la cible « livre-imprimeur » s'arrête avec un message.
  profil-cmjn: "PSOuncoated_v3_FOGRA52.icc"
locked: false
archived: false
version-toolkit: ""
