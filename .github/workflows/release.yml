name: release

# Publie une Release par commit `release: X.Y.Z résumé` poussé sur main :
#   manifest.json          toujours    versions et sha256 de tous les assets
#   toolkit-X.zip          toujours    pipeline/, vscodium-user/, revue-template/,
#                                      livre-template/, windows/
#   <id>-<ver>.vsix        toujours    extensions de windows/vsix.lock, empreintes vérifiées
#   rootfs .tar.gz+.sha256 si image/ a changé depuis la release précédente, ou sur force_rootfs
#   image OCI sur GHCR     quand le rootfs est reconstruit
#
# update.ps1 lit manifest.json et ne télécharge que ce qui a changé : une retouche de
# styles ne pèse que quelques Ko.
#
# ── Le tag est posé PAR la CI, plus par un `git tag` humain (Révision du 21.09.2026) ──────
# Avant : `push: tags: ["v*"]` déclenchait release.yml, qui REJOUAIT ci.yml (job `controles`)
# avant de publier. Le défaut mesuré sur la 1.2.0 (21.09.2026, trois poses du tag) : un tag
# posé à la main pouvait très bien être vert EN LOCAL et rouge sur le runner — la porte
# n'existait qu'après coup, au prix d'une pose à effacer et reposer (`git push --delete`,
# `git tag -d`). Ici, `workflow_run` ne déclenche ce workflow qu'APRÈS que `ci` (ci.yml) a
# fini de tourner sur `main` — la job `tag`, ci-dessous, ne pose le tag QUE si `ci` a conclu
# en succès ET que le commit de tête est un `release: X.Y.Z …` : la CI valide avant de
# publier, jamais après. Le job `controles` qui rejouait ci.yml a donc disparu : `ci` vient
# de tourner pour de vrai sur ce commit, le rejouer serait redondant (voir job `tag`).
#
# `workflow_dispatch` reste pour une repose manuelle (une étape de la publication a échoué
# après que le tag était déjà posé) : le tag n'est alors PAS reposé s'il existe déjà — un tag
# qui existe pour de bon n'est jamais écrasé, dans ce chemin ni dans l'autre.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.2.1) — repose manuelle ; si le tag existe déjà, il n'est pas reposé"
        required: true
      force_rootfs:
        description: "Forcer la reconstruction du rootfs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Pose le tag annoté vX.Y.Z, seulement si :
  #   - déclenché à la main (workflow_dispatch), ou
  #   - `ci` vient de conclure en succès sur `main` ET le commit de tête est un
  #     `release: X.Y.Z résumé` (sujet, première ligne du message de commit).
  # Un commit `release:` dont `ci` échoue ne pose donc aucun tag : c'est le but.
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      pose: ${{ steps.version.outputs.pose }}
    steps:
      # Le SHA du commit que `ci` a réellement validé — jamais `main` HEAD par défaut, qui
      # a pu avancer entre la fin de `ci` et le déclenchement de CE workflow.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # Le message de commit est une donnée EXTERNE (écrite par qui pousse sur main) : elle
      # passe par `env`, jamais interpolée directement dans `run:` — sans quoi un sujet de
      # commit portant des guillemets ou un `$(...)` s'exécuterait comme du shell.
      - name: Lire le sujet du commit de tête (workflow_run)
        if: github.event_name == 'workflow_run'
        id: sujet
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          PREMIERE_LIGNE="${MESSAGE%%$'\n'*}"
          if [[ "$PREMIERE_LIGNE" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)\ (.*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "resume=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::sujet de commit non reconnu comme release, rien à publier : $PREMIERE_LIGNE"
          fi

      - name: Déterminer la version et si le tag doit être posé
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${{ steps.sujet.outputs.version }}"
          fi
          if [ -z "$V" ]; then
            echo "pas de version à publier -- fin de ce workflow"
            echo "pose=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "le tag v$V existe déjà -- repose manuelle, on continue sans le reposer"
              echo "pose=non" >> "$GITHUB_OUTPUT"
            else
              echo "::error::le tag v$V existe déjà -- un tag posé automatiquement n'est JAMAIS écrasé. Ce commit a-t-il déjà été publié, ou ci a-t-il rejoué deux fois sur le même commit ?"
              exit 1
            fi
          else
            echo "pose=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Poser et pousser le tag annoté
        if: steps.version.outputs.pose == 'oui'
        env:
          V: ${{ steps.version.outputs.version }}
          RESUME: ${{ steps.sujet.outputs.resume }}
        run: |
          MESSAGE="Release $V"
          if [ -n "$RESUME" ]; then MESSAGE="Release $V : $RESUME"; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "$MESSAGE"
          git push "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "v$V"

  # Ce qui existait déjà avant le 21.09.2026, inchangé au fond : construit et publie les
  # assets d'une version dont le tag vX.Y.Z existe désormais (posé par le job `tag`
  # ci-dessus, ou déjà là pour une repose manuelle). Ne rejoue PLUS `ci.yml` (l'ancien job
  # `controles`) : `tag` ne s'exécute qu'après un succès de `ci` sur ce même commit, le
  # rejouer serait redondant. `needs: tag` lit sa version en sortie plutôt que `github.ref`
  # (il n'y a plus de push de tag qui déclenche directement ce workflow).
  release:
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    # Groupe par version, pas par ref (il n'y a plus de ref de tag qui déclenche ce
    # workflow) : deux déclenchements pour la même version ne se chevauchent jamais.
    # cancel-in-progress: jamais — une release à moitié publiée est pire qu'une release qui
    # attend son tour.
    concurrency:
      group: release-publish-${{ needs.tag.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write          # créer/mettre à jour la Release
      packages: write          # pousser l'image sur GHCR
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # tags + historique : nécessaires au diff image/
          ref: refs/tags/v${{ needs.tag.outputs.version }}

      - name: Déterminer la version
        id: ver
        run: echo "v=${{ needs.tag.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Récupérer la release précédente (manifest)
        id: prev
        run: |
          PREV_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          rm -f prev-manifest.json
          if [ -n "$PREV_TAG" ]; then
            gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern manifest.json --output prev-manifest.json || true
          fi

      - name: Faut-il reconstruire le rootfs ?
        id: need
        run: |
          NEED=false
          if [ "${{ inputs.force_rootfs }}" = "true" ]; then
            NEED=true; echo "force_rootfs demandé"
          elif [ ! -s prev-manifest.json ]; then
            NEED=true; echo "pas de manifest précédent (1re release nouveau format)"
          elif ! git diff --quiet "${{ steps.prev.outputs.tag }}"..HEAD -- image/; then
            NEED=true; echo "image/ a changé depuis ${{ steps.prev.outputs.tag }}"
          else
            echo "image/ inchangé -> réutilisation du rootfs de ${{ steps.prev.outputs.tag }}"
          fi
          echo "rootfs=$NEED" >> "$GITHUB_OUTPUT"

      - name: Construire le rootfs (.tar.gz)
        if: steps.need.outputs.rootfs == 'true'
        working-directory: image
        env:
          ENGINE: docker        # Docker est préinstallé sur les runners ubuntu-latest
        run: |
          bash ./build-rootfs.sh "${{ steps.ver.outputs.v }}"
          mv szh-publishing-rootfs-*.tar.gz* "$GITHUB_WORKSPACE/"

      - name: Pousser l'image sur GHCR
        if: steps.need.outputs.rootfs == 'true'
        continue-on-error: true      # secondaire : ne doit pas faire échouer la release Windows
        run: |
          V="${{ steps.ver.outputs.v }}"
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "szh-publishing:$V" "$IMG:$V"
          docker tag "szh-publishing:$V" "$IMG:latest"
          docker push "$IMG:$V"
          docker push "$IMG:latest"

      - name: Télécharger et vérifier les VSIX (vsix.lock)
        run: |
          mkdir -p vsix-out
          jq -c '.extensions[]' windows/vsix.lock | while read -r e; do
            id="$(echo "$e"   | jq -r .id)"
            ver="$(echo "$e"  | jq -r .version)"
            url="$(echo "$e"  | jq -r .source)"
            want="$(echo "$e" | jq -r .sha256)"
            f="vsix-out/${id}-${ver}.vsix"
            # open-vsx rend parfois 503 aux runners GitHub pendant plusieurs minutes (trois
            # releases de suite le 17.09.2026) : on insiste avant de renoncer.
            curl -fsSL --retry 8 --retry-delay 20 --retry-all-errors "$url" -o "$f"
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ "$got" != "$want" ]; then
              echo "::error::Empreinte inattendue pour $id $ver (obtenu $got, attendu $want)"
              exit 1
            fi
            echo "OK $id $ver"
          done

      # Les installeurs de VSCodium et SumatraPDF ne sont pas réhébergés en assets — 164 Mo
      # par release pour des fichiers qui ne changent qu'à un bump délibéré. La contrepartie
      # est vérifiée ici, à chaque release : l'URL amont répond, et les octets sont toujours
      # ceux qui sont épinglés. Une disparition ou une substitution amont casse donc la
      # release, pas un poste.
      - name: Vérifier les installeurs épinglés (apps.lock)
        run: |
          mkdir -p apps-out
          jq -c '.applications[]' windows/apps.lock | while read -r a; do
            id="$(echo "$a"   | jq -r .id)"
            ver="$(echo "$a"  | jq -r .version)"
            url="$(echo "$a"  | jq -r .source)"
            want="$(echo "$a" | jq -r .sha256)"
            f="apps-out/$(echo "$a" | jq -r .fichier)"
            curl -fsSL --retry 8 --retry-delay 20 --retry-all-errors "$url" -o "$f"
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ "$got" != "$want" ]; then
              echo "::error::Empreinte inattendue pour $id $ver (obtenu $got, attendu $want)"
              exit 1
            fi
            echo "OK $id $ver ($(du -h "$f" | cut -f1))"
          done
          rm -rf apps-out

      - name: Vérifier le bump de version des extensions
        run: |
          # update.ps1 compare les numéros de version, pas les empreintes : sans bump, un
          # VSIX reconstruit n'est jamais réinstallé sur les postes -- cinq releases de
          # septembre l'ont subi. PREV_TAG vide : première release de ce format, rien à comparer.
          PREV_TAG="${{ steps.prev.outputs.tag }}"
          if [ -z "$PREV_TAG" ]; then
            echo "pas de tag précédent (1re release) -> contrôle sauté"
          else
            for d in szh-apercu szh-cockpit; do
              dossier="vscodium-extension/$d"
              if git diff --quiet "$PREV_TAG"..HEAD -- "$dossier"; then
                echo "$dossier inchangé depuis $PREV_TAG"
                continue
              fi
              fichier="$dossier/package.json"
              v_head="$(jq -r .version "$fichier")"
              v_prev="$(git show "$PREV_TAG:$fichier" | jq -r .version)"
              if [ "$v_head" = "$v_prev" ]; then
                echo "::error::$fichier a changé depuis $PREV_TAG mais sa version est restée $v_head -- bump requis"
                exit 1
              fi
              echo "$dossier : $v_prev -> $v_head"
            done
          fi

      - name: Vérifier que le CHANGELOG porte cette version
        run: |
          # Les notes de la Release sont tirées de CHANGELOG.md : sans section, la Release
          # serait publiée avec un texte générique, et le niveau (majeure / medium / mineure)
          # ne serait justifié nulle part. Le contrôle est ici, avant les VSIX et le rootfs,
          # pour échouer en quelques secondes plutôt qu'après dix minutes de construction.
          V="${{ steps.ver.outputs.v }}"
          if ! grep -qx "## $V" CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de section \"## $V\" -- la release est refusée"
            exit 1
          fi
          echo "CHANGELOG.md : section $V trouvée"

      - name: Construire les extensions maison
        run: |
          # vsce est borné à sa version majeure : la suivante pourrait durcir ses règles
          # de validation et casser la release sans qu'une ligne du dépôt ait changé.
          for d in szh-apercu szh-cockpit; do
            ( cd "vscodium-extension/$d" && npx --yes '@vscode/vsce@^3' package --out "$GITHUB_WORKSPACE/vsix-out/" )
          done

      - name: Construire le toolkit
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p toolkit
          # livre-template : sans lui, new-livre.ps1 s'arrête sur « Gabarit de livre
          # introuvable » sur tous les postes — le gabarit ne vit que dans le toolkit
          # déployé, jamais dans le dépôt d'un poste.
          cp -r pipeline vscodium-user revue-template livre-template windows toolkit/
          # nouveautes.json : la note que « Quoi de neuf » montre à la rédaction. Livrée avec
          # le TOOLKIT et non dans le VSIX du cockpit — elle est indexée par version du
          # toolkit, et la loger dans l'extension forcerait un bump du cockpit à chaque
          # release, y compris quand pas une ligne de son code n'a bougé.
          cp nouveautes.json toolkit/
          echo "$V" > toolkit/VERSION
          (cd toolkit && zip -qr "../toolkit-$V.zip" .)
          sha256sum "toolkit-$V.zip" | tee "toolkit-$V.zip.sha256"

      - name: Générer manifest.json
        run: |
          V="${{ steps.ver.outputs.v }}"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download"
          if [ "${{ steps.need.outputs.rootfs }}" = "true" ]; then
            RF="szh-publishing-rootfs-$V.tar.gz"
            ROOTFS_JSON="$(jq -n --arg v "$V" --arg f "$RF" \
              --arg u "$BASE/v$V/$RF" \
              --arg s "$(cut -d' ' -f1 "$RF.sha256")" \
              '{version:$v, file:$f, url:$u, sha256:$s}')"
          else
            ROOTFS_JSON="$(jq -c .rootfs prev-manifest.json)"
          fi
          TOOLKIT_JSON="$(jq -n --arg f "toolkit-$V.zip" \
            --arg u "$BASE/v$V/toolkit-$V.zip" \
            --arg s "$(cut -d' ' -f1 "toolkit-$V.zip.sha256")" \
            '{file:$f, url:$u, sha256:$s}')"
          VSIX_JSON="$(jq --arg base "$BASE/v$V" \
            '[.extensions[] | {id, version, file: (.id+"-"+.version+".vsix"), url: ($base+"/"+.id+"-"+.version+".vsix"), sha256}]' \
            windows/vsix.lock)"
          # Les extensions maison s'ajoutent au manifest avec le sha256 calculé au build :
          # un VSIX reconstruit n'ayant jamais le même sha, elles ne sont pas épinglées
          # dans vsix.lock. update.ps1 vérifie le fichier téléchargé contre ce sha.
          for NOM in szh-apercu szh-cockpit; do
            OWN="$(ls vsix-out/$NOM-*.vsix)"
            OWNBASE="$(basename "$OWN")"
            OWNVER="${OWNBASE#$NOM-}"; OWNVER="${OWNVER%.vsix}"
            OWNSHA="$(sha256sum "$OWN" | cut -d' ' -f1)"
            VSIX_JSON="$(echo "$VSIX_JSON" | jq --arg base "$BASE/v$V" \
              --arg id "szh-csps.$NOM" --arg v "$OWNVER" --arg f "$OWNBASE" --arg s "$OWNSHA" \
              '. + [{id:$id, version:$v, file:$f, url:($base+"/"+$f), sha256:$s}]')"
          done
          jq -n --arg v "$V" \
            --argjson rootfs  "$ROOTFS_JSON" \
            --argjson toolkit "$TOOLKIT_JSON" \
            --argjson vsix    "$VSIX_JSON" \
            '{version:$v, rootfs:$rootfs, toolkit:$toolkit, vsix:$vsix}' | tee manifest.json

      - name: Publier la Release
        run: |
          V="${{ steps.ver.outputs.v }}"
          ASSETS=(manifest.json "toolkit-$V.zip" "toolkit-$V.zip.sha256" vsix-out/*.vsix)
          if [ "${{ steps.need.outputs.rootfs }}" = "true" ]; then
            ASSETS+=("szh-publishing-rootfs-$V.tar.gz" "szh-publishing-rootfs-$V.tar.gz.sha256")
          fi
          # Les notes viennent de CHANGELOG.md, section "## <version>" jusqu'au titre suivant
          # (la présence de la section est contrôlée bien plus haut). --notes-file et non
          # --notes : le texte porte des retours à la ligne et des caractères que le shell
          # relirait.
          awk -v v="$V" '$0 == "## " v { dedans = 1; next } /^## / { if (dedans) exit } dedans' \
              CHANGELOG.md > notes.md
          # Le pied, en echo et non en heredoc : un heredoc se termine sur une ligne sans
          # indentation, que le scalaire de bloc YAML ne peut pas porter -- « --- » en colonne
          # 1 ferait même un second document, et ci.yml serait refusé en entier.
          {
            echo ""
            echo "---"
            echo "Toolkit (pipeline + config + template + scripts) et extensions épinglées."
            echo "Rootfs WSL : voir \`manifest.json\` (réutilisé si \`image/\` est inchangé)."
            echo "Déployé automatiquement par \`update.ps1\`."
          } >> notes.md
          # Crée la Release, ou met à jour ses assets si elle existe déjà.
          gh release create "v$V" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Toolchain v$V" \
              --notes-file notes.md \
          || gh release upload "v$V" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
