name: ci

# Porte par commit. release.yml ne se déclenche que sur un tag v* : une régression de
# maquette ou de balisage ne s'y voyait qu'au moment de publier, c'est-à-dire trop tard.
# Ici, deux choses se vérifient à chaque push :
#   contrats   node --test test/js/*.test.js — les contrats du cockpit, comme release.yml
#   pdf-ua     le banc test/ recompilé de zéro (test/out/ n'est pas versionné), puis
#              `make verifier-ua` : veraPDF rend un verdict PDF/UA-1 sur chaque PDF
#
# La toolchain est épinglée comme dans image/Containerfile (pandoc 3.5, WeasyPrint 69 via
# image/requirements.txt) : sans cela, le verdict de la CI ne serait pas celui de la flotte.
# Ce workflow ne publie rien.

on:
  # `branches` sur push évite le doublon push + pull_request pour une branche du dépôt,
  # et laisse les tags v* à release.yml.
  push:
    branches: [main]
  pull_request:
  # Rejoué par release.yml (job `controles`), sans paramètre : une release ne publie
  # qu'après le même verdict que push et pull_request, plutôt que de rejouer `node --test`
  # seul et de découvrir une régression de maquette au moment de publier.
  workflow_call:

permissions:
  contents: read          # lecture seule : rien n'est publié ici

concurrency:
  # Une branche poussée en rafale n'empile pas dix builds : seul le dernier compte.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rapide et sans outillage : ne doit pas attendre l'installation de la chaîne PDF.
  contrats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les contrats du cockpit
        run: node --test test/js/*.test.js

      # Les deux contrôles qui ne demandent que la bibliothèque standard. Ils vivaient
      # hors de la CI, et ne tournaient donc que quand quelqu'un y pensait : le chantier
      # livre a poussé treize écarts typographiques dans les libellés du lanceur sans que
      # rien ne le dise. Ce qu'aucune porte ne garde finit toujours par glisser.
      - name: Vérifier les contrastes de la palette (APCA)
        run: python3 test/apca-check.py

      # Insécable devant « : ; ! ? », à l'intérieur des « … », demi-cadratin d'incise —
      # les règles de docs/TYPOGRAPHIE.md, appliquées aux textes VISIBLES du cockpit et
      # des lanceurs. Un manquement ne casse rien : il laisse une ponctuation orpheline en
      # début de ligne, et ne se voit qu'imprimé.
      - name: Vérifier la typographie des textes visibles
        run: python3 test/typo-check.py

  # `contrats` tourne sur ubuntu-latest : il ne voit jamais les tests dont le corps est du
  # PowerShell réel (spawnSync de powershell.exe) — orphelins-toolkit, toolkit-remplacement,
  # socle-decoupage, lanceur, rythme-maj, emplacements, diagnostic, installation,
  # volume-numero, raccourcis... — ils s'y sautent proprement (powershell.exe introuvable)
  # au lieu d'y échouer, et la CI ne validait donc jamais ce que ces scripts font vraiment
  # sur un poste Windows. Indépendant de `pdf-ua` (pas de `needs`) : les deux tournent en
  # parallèle. Repris par release.yml (workflow_call) : ce job garde aussi les releases.
  contrats-windows:
    runs-on: windows-latest
    permissions:
      contents: read          # lecture seule, comme le reste du workflow
    steps:
      - uses: actions/checkout@v5

      - name: Installer Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # `*` n'est développé ni par PowerShell ni par cmd : shell: bash (Git Bash, présent sur
      # les runners windows-latest) fait le même glob que le job `contrats`. Reporter TAP
      # explicite plutôt que le reporter par défaut (qui dépend de la détection de tty) : la
      # prochaine étape doit lire un total fiable quel que soit le runner.
      - name: Vérifier les contrats du cockpit (Windows)
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-reporter-destination=stdout \
            test/js/*.test.js | tee contrats-windows.tap

      # Sans ce plancher, un powershell.exe devenu introuvable sur le runner (image GitHub
      # changée, PATH modifié) ferait sauter en silence les tests PowerShell et le job
      # resterait vert avec un total plus bas — jamais un vert par défaut.
      #
      # Plancher ESTIMÉ, pas mesuré : ces tests ne reconnaissent aucune bascule du genre
      # SZH_SANS_POWERSHELL pour rejouer « sans PowerShell » sur ce poste de développement,
      # qui a PowerShell, la WSL et pandoc tous les trois installés (1018 tests, 1018 pass, 0
      # sauté). Compte à la lecture des gardes :
      #   - 44 tests se sautent via `{ skip: sansPowerShell }` / `POWERSHELL ? false : ...`
      #     (diagnostic, emplacements, installation, lanceur, lien-langue, orphelins-toolkit,
      #     raccourcis, rythme-maj, socle-decoupage, toolkit-remplacement, volume-numero) —
      #     absent seulement sur ubuntu (pas de powershell.exe) ; PRÉSENT sur windows-latest.
      #   - 39 tests se sautent via une vérification réelle de wsl.exe/pandoc, pas seulement
      #     process.platform (ancrages, biblio, date-numero, fleche-retour,
      #     import-numerotation-titres, journal-codes, metafichier, lire-config) — absents ici
      #     COMME sur ubuntu, ce runner n'a pas la distro SZH-Publishing.
      # D'où : ubuntu ≈ 1018-44-39 = 935 ; windows-latest ≈ 1018-39 = 979. Plancher posé à 950,
      # au-dessus du compte ubuntu, en dessous du compte Windows attendu.
      - name: Vérifier le nombre de tests passés
        shell: bash
        run: |
          compte="$(grep -E '^# pass [0-9]+$' contrats-windows.tap | tail -n1 | grep -oE '[0-9]+')"
          plancher=950
          echo "tests passés : ${compte:-?} (plancher $plancher)"
          if [ -z "$compte" ] || [ "$compte" -lt "$plancher" ]; then
            echo "::error::$compte tests passés sur ce runner, plancher $plancher — les tests PowerShell n'ont peut-être pas tourné"
            exit 1
          fi

  pdf-ua:
    # Version du runner épinglée : les noms de paquets apt ci-dessous (libffi8) sont liés
    # à la version d'Ubuntu. Un « latest » qui glisse casserait l'installation sans
    # qu'une ligne du dépôt ait changé.
    runs-on: ubuntu-24.04
    env:
      PANDOC_VERSION: "3.5"
      # Empreinte du .deb, calculée depuis cette même URL. Elle garde le cache honnête :
      # un fichier restauré tronqué se retélécharge au lieu de casser dpkg.
      PANDOC_DEB_SHA256: "4f41d817d262ef3d17953a3e6e0fefddb971aa4f2f121544a9a86db449d945e1"
      VERAPDF_VERSION: "1.30.2"
      VERAPDF_ZIP_SHA256: "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838"
    steps:
      - uses: actions/checkout@v5

      # veraPDF est un outil Java. L'image WSL embarque un runtime taillé au jlink ; ici
      # on prend un JDK complet : veraPDF a besoin des modules java.desktop et
      # java.management, qu'un JRE amputé n'aurait pas.
      - name: Installer le JDK (veraPDF)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Même liste que image/Containerfile : Pango, HarfBuzz et fontconfig pour WeasyPrint.
      # fonts-noto est volontairement écarté (plusieurs centaines de Mo pour un filet de
      # caractères rares) : les polices de la maquette voyagent en base64 dans print.css,
      # et la porte PDF/UA juge le balisage, pas le choix de glyphe. DejaVu reste comme
      # famille de repli, pour que WeasyPrint ait toujours une police à substituer.
      - name: Installer les dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            make python3 python3-venv \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fontconfig \
            fonts-dejavu-core

      # Les deux archives épinglées sont vérifiées par sha256 après restauration : un cache
      # douteux se retélécharge, il ne fait pas échouer le build.
      - name: Cache des archives épinglées
        uses: actions/cache@v4
        with:
          path: ~/.cache/szh-ci
          key: outils-pandoc${{ env.PANDOC_VERSION }}-verapdf${{ env.VERAPDF_VERSION }}

      - name: Installer pandoc ${{ env.PANDOC_VERSION }}
        run: |
          # Le pandoc d'apt n'est pas en 3.5 : on prend le .deb des releases GitHub, même
          # URL que image/Containerfile. Les filtres Lua du pipeline sont écrits pour
          # cette version.
          mkdir -p ~/.cache/szh-ci
          deb="$HOME/.cache/szh-ci/pandoc-$PANDOC_VERSION-1-amd64.deb"
          if ! echo "$PANDOC_DEB_SHA256  $deb" | sha256sum -c --status 2>/dev/null; then
            curl -fsSL -o "$deb" \
              "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
            echo "$PANDOC_DEB_SHA256  $deb" | sha256sum -c
          fi
          sudo dpkg -i "$deb"

      - name: Cache des roues pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('image/requirements.txt') }}

      # venv isolé et requirements.txt figé, comme dans l'image : un `pip install
      # weasyprint` libre ferait diverger le rendu de la CI de celui de la flotte.
      # requirements-portraits.txt (rembg, OpenCV) n'est pas installé : la chaîne PDF ne
      # s'en sert pas.
      - name: Installer WeasyPrint (image/requirements.txt)
        run: |
          python3 -m venv "$RUNNER_TEMP/weasyprint"
          "$RUNNER_TEMP/weasyprint/bin/pip" install --quiet -r image/requirements.txt
          # Le Makefile appelle `weasyprint` par son nom : il lui faut le PATH.
          echo "$RUNNER_TEMP/weasyprint/bin" >> "$GITHUB_PATH"

      - name: Installer veraPDF ${{ env.VERAPDF_VERSION }} (CLI seul)
        run: |
          mkdir -p ~/.cache/szh-ci
          zip="$HOME/.cache/szh-ci/verapdf-$VERAPDF_VERSION-installer.zip"
          if ! echo "$VERAPDF_ZIP_SHA256  $zip" | sha256sum -c --status 2>/dev/null; then
            curl -fsSL -o "$zip" \
              "https://software.verapdf.org/releases/1.30/verapdf-greenfield-$VERAPDF_VERSION-installer.zip"
            echo "$VERAPDF_ZIP_SHA256  $zip" | sha256sum -c
          fi
          unzip -q -o "$zip" -d "$RUNNER_TEMP/verapdf-src"
          dest="$RUNNER_TEMP/verapdf-cli"
          # Installeur IzPack, piloté par un XML d'auto-installation. Le pack GUI
          # désélectionné ramène l'installation de ~48 à 18 Mio ; headless parce que le
          # runner n'a pas d'écran.
          cat > "$RUNNER_TEMP/verapdf-auto.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$dest</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="false"/>
              <pack index="1" name="veraPDF CLI" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.SimpleFinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -Djava.awt.headless=true -jar \
            "$RUNNER_TEMP/verapdf-src/verapdf-greenfield-$VERAPDF_VERSION/verapdf-izpack-installer-$VERAPDF_VERSION.jar" \
            "$RUNNER_TEMP/verapdf-auto.xml"
          # Le Makefile cherche le validateur dans /opt/verapdf-cli et son runtime dans
          # /opt/jre-min — l'image WSL. Ses deux variables sont surchargeables depuis
          # l'environnement, précisément pour une CI qui les installe ailleurs.
          echo "VERAPDF=$dest/verapdf" >> "$GITHUB_ENV"
          echo "VERAPDF_JAVA=$JAVA_HOME" >> "$GITHUB_ENV"

      # Avant de compiler, pas après : un validateur absent ou muet ne doit jamais se lire
      # comme un PDF conforme. `verifier-ua` sait déjà refuser (test -x, puis codes 4/7/127
      # traités comme des pannes) — cette étape le constate en une ligne au lieu de le
      # découvrir à la fin d'un build.
      - name: Contrôler l'outillage
        run: |
          test -x "$VERAPDF" || { echo "::error::veraPDF introuvable : $VERAPDF"; exit 1; }
          JAVA_HOME="$VERAPDF_JAVA" "$VERAPDF" --version
          v="$(pandoc --version | head -n1 | cut -d' ' -f2)"
          test "$v" = "$PANDOC_VERSION" || { echo "::error::pandoc $v au lieu de $PANDOC_VERSION"; exit 1; }
          echo "pandoc $v"
          # `--info` ouvre par des lignes de noyau : on ne garde que ce qui nous concerne.
          weasyprint --info | grep -E "^(WeasyPrint|Pydyf|Pango) version"
          python3 --version

      # Le banc est un dossier de revue (test/ausgabe.yaml + articles/<slug>/) et le
      # Makefile s'invoque depuis ce dossier. test/out/ n'est pas versionné : tout est
      # recompilé, rien n'est repris d'un artefact.
      - name: Compiler le banc de test
        working-directory: test
        run: make -f "$GITHUB_WORKSPACE/pipeline/Makefile" pdf

      # La porte. VERAPDF et VERAPDF_JAVA viennent de l'étape d'installation ; s'ils
      # manquaient, le Makefile retomberait sur les chemins de l'image WSL, absents du
      # runner, et échouerait — jamais un vert par défaut.
      - name: Valider les PDF en PDF/UA-1
        working-directory: test
        run: make -f "$GITHUB_WORKSPACE/pipeline/Makefile" verifier-ua

      # Les deux LIVRES du banc. Ils gardent ce qu'un article ne peut pas garder : la
      # numérotation qui court d'un chapitre à l'autre, le sommaire dont les numéros de
      # page sont posés à la pagination, et surtout la conformité PDF/UA d'un document de
      # Ce que les filtres Lua font vraiment, pandoc à l'appui. Ces contrôles vivent hors
      # du glob `test/js/*.test.js` exprès : le job `contrats` n'a pas la chaîne PDF, et
      # doit rendre son verdict sans l'attendre. Chacun vérifie d'abord que le défaut se
      # reproduit SANS le filtre — sans quoi il ne prouverait rien le jour où pandoc
      # changerait de comportement.
      - name: Vérifier les filtres qui demandent pandoc
        run: node --test test/filtres-pandoc.test.js

      # plusieurs chapitres — qu'un tableau mal placé ou une liste lâche suffit à faire
      # tomber SANS ERREUR VISIBLE.
      # Le verdict se lit sur l'ABSENCE de FAIL, jamais sur la présence d'un PASS :
      # veraPDF rend une ligne par fichier, et un livre en a plusieurs.
      - name: Compiler et valider les livres du banc
        run: |
          for livre in livre-normal livre-falc; do
            echo "::group::$livre"
            ( cd "test/$livre"               && make -f "$GITHUB_WORKSPACE/pipeline/Makefile" livre livre-couverture livre-epub )
            ua="$RUNNER_TEMP/$livre.ua"
            JAVA_HOME="$VERAPDF_JAVA" "$VERAPDF" --flavour ua1 --format text               "test/$livre/out/"*.pdf > "$ua" 2>&1 || true
            cat "$ua"
            if grep -q "^FAIL" "$ua" || ! grep -q "^PASS" "$ua"; then
              echo "::error::$livre : PDF/UA-1 non conforme"
              exit 1
            fi
            echo "::endgroup::"
          done

      # De quoi comprendre un rouge sans rejouer la CI à l'aveugle : les PDF incriminés et
      # le rapport XML de veraPDF, que rapport-ua.py a traduit.
      - name: Récupérer les PDF et le rapport veraPDF
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-ua-diagnostic
          path: |
            test/out/**/*.pdf
            test/out/.szh-pdfua.xml
            test/out/.szh-pdfua.err
            test/livre-*/out/*.pdf
            test/livre-*/out/*.html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
