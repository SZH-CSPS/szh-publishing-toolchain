# Copié en /etc/wsl.conf, lu au démarrage de la distro ; `wsl --terminate <distro>` après
# un import force une relecture propre.

[user]
# Utilisateur par défaut d'une distro importée : le seul moyen fiable de le fixer.
default=redac

[automount]
enabled=true
# metadata : permissions POSIX conservées en attributs NTFS, utile sur /mnt/c.
# case=off : ni OneDrive ni NTFS ne sont sensibles à la casse.
options="metadata,umask=22,fmask=11,case=off"
mountFsTab=false

[interop]
enabled=true
# Le PATH Windows est inutile ici : autant réduire la surface.
appendWindowsPath=false

[boot]
systemd=false
