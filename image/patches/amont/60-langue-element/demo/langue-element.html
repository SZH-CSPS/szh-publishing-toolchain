<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Langue des passages</title>
</head>
<body>
  <p>Un paragraphe en français, avec un <span lang="en">mindset</span> anglais.</p>
  <section lang="de">
    <h1>Zusammenfassung</h1>
    <p>Ein deutscher Absatz mit <em>Betonung</em>.</p>
  </section>
  <blockquote lang="en"><p>An English quotation.</p></blockquote>
  <p>Retour au français, <span lang="fr">sans changement</span>.</p>
</body>
</html>
