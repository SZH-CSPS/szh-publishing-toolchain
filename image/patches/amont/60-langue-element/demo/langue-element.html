<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Language of passages</title>
</head>
<body>
  <h1>Language of passages</h1>
  <p>An English paragraph with the French word <span lang="fr">bricolage</span>.</p>
  <section lang="de">
    <h2>Zusammenfassung</h2>
    <p>Ein deutscher Absatz mit <em>Betonung</em> und dem englischen Wort
    <span lang="en">mindset</span>.</p>
  </section>
  <blockquote lang="fr"><p>Une citation en français.</p></blockquote>
  <p>Back to English, <span lang="en">with a redundant lang attribute</span>.</p>
  <p>Malformed values: <span lang="en_US">underscore</span>, <span lang="">empty</span>.</p>
</body>
</html>
