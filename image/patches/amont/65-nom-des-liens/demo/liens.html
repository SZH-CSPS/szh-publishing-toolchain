<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Link names</title>
  <style>
    a.icon { display: inline-block; width: 4mm; height: 4mm; background: #a6ce39; }
  </style>
</head>
<body>
  <p id="call">See <a href="https://example.org/">the   example
    site</a> and the note<a href="#note">1</a>.</p>
  <p>Download the <a href="https://example.org/report.pdf"
    aria-label="Annual report, PDF, 2 MB">report</a>.</p>
  <p>Read the <a href="https://example.org/guide">guide<span style="display: none">
    (hidden text)</span></a>.</p>
  <p>
    <a class="icon" href="https://orcid.org/0000-0002-1825-0097"
       aria-label="ORCID profile of Jane Doe"></a>
    <a class="icon" href="https://creativecommons.org/licenses/by/4.0/" title="CC BY 4.0"></a>
    <a class="icon" href="https://example.org/nameless"></a>
  </p>
  <p id="note">1. A footnote. <a class="icon" href="#call" aria-label="Back to the call"></a></p>
</body>
</html>
