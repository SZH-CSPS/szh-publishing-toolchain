<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Header spanning two columns</title>
</head>
<body>
  <table>
    <thead>
      <tr><th>Name</th><th colspan="2">Points</th></tr>
    </thead>
    <tbody>
      <tr><td>Anna</td><td>12</td><td>15</td></tr>
      <tr><td>Ben</td><td>9</td><td>11</td></tr>
    </tbody>
  </table>
</body>
</html>
