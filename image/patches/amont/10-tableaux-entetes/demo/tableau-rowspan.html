<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Row header spanning two rows</title>
</head>
<body>
  <table>
    <tr><td></td><th>Test A</th><th>Test B</th></tr>
    <tr><th scope="row" rowspan="2">Group 1</th><td>12</td><td>15</td></tr>
    <tr><td>9</td><td>11</td></tr>
  </table>
</body>
</html>
