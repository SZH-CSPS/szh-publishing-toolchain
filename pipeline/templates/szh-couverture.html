<!DOCTYPE html>
<!-- Gabarit de la COUVERTURE, rempli par couverture.py par remplacement de jetons littéraux
     (pas par pandoc : le texte de 4e est déjà du HTML compilé, pandoc le dissoudrait).

     Un seul gabarit pour les deux sorties : $classes$ porte szh-couv-impression (une page
     à plat, CMJN, fond perdu, traits) ou szh-couv-ecran (1re puis 4e, RGB, sans dos), la
     maquette (falc | normal) et le format (standard | a4). Dimensions et couleurs arrivent
     en propriétés personnalisées ($variables$), la page et le profil CMJN dans $style-page$ :
     couverture.css n'écrit en dur aucune taille de livre ni aucune couleur.

     L'ordre du DOM est celui de l'écran (1re, 4e) et de la lecture balisée PDF/UA ; à plat,
     chaque panneau est posé en absolu à sa place (4e, dos, 1re). -->
<html lang="$lang$" class="$classes$" style="$variables$">
<head>
  <meta charset="utf-8" />
  <meta name="generator" content="szh-publishing-toolchain" />
  <title>$titre$</title>
$css$
  <style>
$style-page$
  </style>
</head>
<body>
<div class="szh-couv-plat">
  <div class="szh-couv-fond"></div>

  <section class="szh-couv-1re">
    $illustration$
    <div class="szh-couv-1re-bandeau">
      <p class="szh-couv-auteurs">$responsables$</p>
      <p class="szh-couv-titre">$titre-bloc$</p>
      <p class="szh-couv-sous-titre">$sous-titre-bloc$</p>
    </div>
    <div class="szh-couv-1re-pied">
$pied$
    </div>
  </section>

  <section class="szh-couv-4e">
    <div class="szh-couv-4e-texte">
$quatrieme$
    </div>
  </section>

  <section class="szh-couv-dos">
$dos$
  </section>

$traits$
</div>
</body>
</html>
