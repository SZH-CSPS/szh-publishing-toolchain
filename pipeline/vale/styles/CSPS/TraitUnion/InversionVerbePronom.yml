# Inversion verbe-pronom (interrogation, incise) : trait d'union obligatoire entre le verbe et
# le pronom sujet inversé — avec un « -t- » euphonique intercalé quand la forme verbale se
# termine par une lettre-voyelle (a, e), jamais quand elle se termine déjà par une consonne
# écrite (t, d).
# Source : Wikipédia, « Trait d'union » (fr.wikipedia.org/wiki/Trait_d'union), §Inversion
# verbe-pronom / « Le phonème éphelcystique /t/ s'écrit donne-t-il, y a-t-il (jamais
# apostrophe) ». Revue : 4.5 Autres aspects typographiques cite elle-même « y a-t-il » comme
# exemple de trait d'union.
#
# Petit lexique fermé de verbes courants à la 3e personne (jamais « n'importe quel verbe » :
# un participe/adjectif qui ressemble à une 3e personne ne s'inverse jamais ainsi). Le choix
# entre trait d'union direct et « -t- » euphonique n'est PAS arbitraire : une forme plurielle
# française (« -ent », « ont », « sont », « vont ») se termine TOUJOURS par un « t » écrit —
# jamais de « -t- » au pluriel. Seules les formes SINGULIÈRES qui se terminent par une lettre
# voyelle (a, va, et les verbes en -e du 1er groupe) prennent le « -t- » (erreur mesurée en se
# relisant avant livraison : une première version insérait à tort un « -t- » après toutes les
# formes plurielles en -ent, corrigée ici).
#
# ⚠ « elle »/« elles » ABSENTS de tout couple, et « part »/« partent » RETIRÉS du lexique de
# verbes — deux défauts mesurés en vrai sur les 92 articles publiés du corpus (21.09.2026,
# rapport de chantier) :
#   - « part » est aussi le nom de l'idiome « d'une part... d'autre part » : « d'une part elle
#     vise... » n'est jamais une inversion, c'était pourtant signalé avant ce retrait.
#   - le français réutilise « elle »/« elles » comme pronom SUJET (l'inversion visée ici) ET
#     comme pronom DISJOINT/réfléchi (« c'est elle », « elle-même », « elles-mêmes ») —
#     « est elle » collisionnait avec CES DEUX constructions, très fréquentes, jamais des
#     fautes (mesuré : 4 des 5 fausses alertes de cette règle sur le corpus venaient de là).
#     Le masculin n'a pas ce problème (le disjoint/réfléchi y prend une forme différente :
#     « lui-même », « eux-mêmes », « c'est lui », jamais « il-même »/« ils-mêmes ») — il/ils
#     restent donc dans le lexique, « on » aussi (pas de forme disjointe).
extends: substitution
message: "%s (inversion verbe-pronom, trait d'union obligatoire) au lieu de « %s »."
level: warning
ignorecase: true
action:
  name: replace
