# Orthographe rectifiée (1990) : verbes en -eler/-eter réguliers, accent grave + consonne simple, sur le modèle de peler/acheter (Wikipédia : Rectifications orthographiques du français en 1990, §Verbes en -eler et -eter). Exceptions JAMAIS mécanisées (absentes du CSV) : appeler, jeter et leurs dérivés (dont interpeler), qui gardent le doublement traditionnel.
# Décision de la rédaction (21.09.2026) : la Revue écrit en orthographe rectifiée, pas en traditionnelle -- une graphie traditionnelle rencontrée ici est une faute résiduelle, jamais une politique à trancher. `warning`, jamais `suggestion`.
