# Orthographe rectifiée (1990) : accent aigu remplacé par un accent grave (Wikipédia : Rectifications orthographiques du français en 1990, §Accent grave). Limité ici aux noms/adjectifs (événement, réglementaire...) — jamais aux formes conjuguées de type « je cèderai » (accord verbal, hors mécanisable sans lookaround).
# Décision de la rédaction (21.09.2026) : la Revue écrit en orthographe rectifiée, pas en traditionnelle -- une graphie traditionnelle rencontrée ici est une faute résiduelle, jamais une politique à trancher. `warning`, jamais `suggestion`.
