# Orthographe rectifiée (1990) : accent circonflexe sur i/u supprimé (Wikipédia : Rectifications orthographiques du français en 1990, §Accent circonflexe). Exceptions JAMAIS mécanisées ici (absentes du CSV, donc jamais touchées par cette règle) : dû (masculin singulier seul), mûr, sûr, jeûne, et le verbe croître (bare, sans préfixe — accroître/décroître, eux, perdent l'accent) ; formes du passé simple/subjonctif imparfait (nous fûmes, qu'il fût...) ; noms propres (Nîmes, Benoît).
