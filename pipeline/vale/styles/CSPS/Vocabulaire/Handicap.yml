# Revue : 2.3 Vocabulaire — renvoi explicite du PDF à la liste de l'OQLF pour les termes du
# handicap. « personne(s) handicapée(s) » a migré vers Vocabulaire/HandicapPersonne.yml (même
# chapitre) : ce cas a besoin d'un raffinage Python pour ne jamais signaler un nom propre de
# loi ou de convention (« Loi … pour les personnes handicapées (LHand) », « Convention …
# des personnes handicapées (CDPH) », voir 3.1.3) — une substitution YAML pure ne peut pas
# faire cette exception. LE PIÈGE OQLF/CSPS reste : l'OQLF privilégie « personne handicapée »,
# la Revue (RIPPH/MDH-PPH) privilégie « personne en situation de handicap » — voir ce fichier
# voisin pour le détail.
#
# ⚠ Mesuré sur le corpus publié (92 articles, 21.09.2026) : la paire « élèves à besoins
# éducatifs particuliers » -> « élèves bénéficiant d'un soutien éducatif », pourtant l'exemple
# même du PDF (2.3), est retirée d'ici. « élèves à besoins éducatifs particuliers » est devenu,
# depuis 2024, un terme légal et clinique suisse établi (sigle BEP, développé et redéveloppé
# des dizaines de fois dans le corpus publié lui-même) — pas un euphémisme que la rédaction
# corrige encore. Le signaler comme fautif aurait fait rougir des articles déjà publiés et
# jugés conformes par quatre relectures. Décision prise seule (chantier vale-passe-2) : même
# logique que le piège OQLF/CSPS déjà documenté ici — un terme établi ne se corrige pas parce
# qu'un PDF plus ancien en préférait un autre.
extends: substitution
message: "%s est préférable à « %s » (Revue : 2.3 Vocabulaire, cf. liste OQLF)."
level: suggestion
ignorecase: true
action:
  name: replace
swap:
  # places (réservées) pour (les) handicapés -> places accessibles (exemple exact du PDF)
  "places? (?:réservées? )?pour (?:les )?handicapés?": "places accessibles"
  # trois formes stigmatisantes usuelles, hors du PDF mais couvertes par son renvoi explicite
  # à la liste OQLF (2.3, dernier paragraphe)
  "souffre d[e’']": "vit avec"
  "atteint(?:e)?s? d[e’']": "présentant"
  "confiné(?:e)?s? (?:au|dans un) fauteuil roulant": "se déplace en fauteuil roulant"
