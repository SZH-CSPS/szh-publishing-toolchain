# Configuration Vale du nettoyeur de manuscrit (article) — §7 de
# outils-dev/ARCHITECTURE-nettoyeur-manuscrit.md. Vale ne voit jamais le .docx : il ne lit
# que les .txt qu'écrit pipeline/manuscrit_vale.py, un paragraphe par ligne.
#
# Le nom du fichier porte la LANGUE et le RÔLE (corps ou bibliographie) : c'est le seul
# mécanisme qui empêche une règle de langage épicène de s'appliquer à une bibliographie
# (où elle n'aurait rien à faire — une référence cite un auteur tel qu'il a publié, pas tel
# que la rédaction voudrait l'écrire) et qui empêche une règle de bibliographie APA de
# s'appliquer au corps.
StylesPath = styles
MinAlertLevel = suggestion

# ⚠ Mesuré le 18.09.2026 (Vale 3.22.0) : un nom de fichier LITTÉRAL en en-tête de section
# ([corps-fr.txt], sans caractère générique) ne déclenche JAMAIS aucune règle — Vale ne
# reconnaît le format/la portée d'un fichier que via un motif générique COMMENÇANT par `*`.
# `[*.txt]` fonctionne : `[corps-fr.txt]` ne fonctionne pas, silencieusement (aucune erreur,
# juste zéro alerte). D'où l'étoile en tête de chaque section ci-dessous : c'est elle qui
# sépare corps-fr.txt de corps-de.txt, jamais le nom seul.

# Corps de l'article, français : langage épicène, vocabulaire du handicap, casse maison,
# et les deux règles APA qui vivent dans le corps (liaison et/&, citation directe).
[*corps-fr.txt]
BasedOnStyles = CSPS

# Bibliographie, français : UNIQUEMENT les règles de forme des références (DOI, esperluette
# avant le dernier auteur). Jamais Epicene ni Vocabulaire ici : une référence reproduit le
# nom d'une autrice ou d'un auteur tel qu'il ou elle a publié, la rédaction n'a pas à le
# corriger.
[*biblio-fr.txt]
BasedOnStyles = CSPS-Biblio

# Corps de l'article, allemand : Paarform et vocabulaire du handicap allemand.
[*corps-de.txt]
BasedOnStyles = SZH

# Bibliographie, allemand : aucune famille APA allemande n'a été demandée pour ce lot (voir
# le LISEZMOI). La section existe pour que le nom de fichier reste symétrique au français ;
# elle ne charge aucun style tant qu'aucune règle bibliographique allemande n'est écrite.
[*biblio-de.txt]
